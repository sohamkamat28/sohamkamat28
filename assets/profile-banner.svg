    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(192 284) rotate(90) scale(160 360)">
      <stop stop-color="#F6C453" stop-opacity="0.18"/>
