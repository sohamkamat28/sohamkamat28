<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soham Kamat - Building thoughtful software</title>
  <desc id="desc">A refined dark editorial banner with the name Soham Kamat and a short developer tagline.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090909"/>
      <stop offset="0.42" stop-color="#101114"/>
      <stop offset="1" stop-color="#071514"/>
    </linearGradient>
    <linearGradient id="line" x1="170" y1="37" x2="1120" y2="316" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5D38A"/>
      <stop offset="0.48" stop-color="#F6F0DE"/>
      <stop offset="1" stop-color="#68E0C4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(645 168) rotate(90) scale(210 560)">
      <stop stop-color="#F6F0DE" stop-opacity="0.16"/>
      <stop offset="0.62" stop-color="#68E0C4" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.95 0 0 0 0 0.83 0 0 0 0 0.55 0 0 0 0.5 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <pattern id="grain" width="140" height="140" patternUnits="userSpaceOnUse">
      <path d="M0 139H140M139 0V140" stroke="#FFFFFF" stroke-opacity="0.035"/>
      <circle cx="26" cy="29" r="1" fill="#FFFFFF" fill-opacity="0.08"/>
      <circle cx="104" cy="78" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
      <circle cx="64" cy="118" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#canvas)"/>
  <rect width="1280" height="360" fill="url(#halo)"/>
  <rect width="1280" height="360" fill="url(#grain)"/>

  <path d="M0 284C141 238 262 225 400 244C559 266 664 315 824 288C1008 257 1128 159 1280 173V360H0V284Z" fill="#101A18" fill-opacity="0.58"/>
  <path d="M76 78C207 24 364 47 486 129C614 215 729 241 872 184C987 139 1082 84 1203 103" stroke="url(#line)" stroke-width="1.5" stroke-opacity="0.32"/>
  <path d="M88 265C246 176 424 174 566 236C704 296 815 310 952 237C1055 182 1154 174 1242 207" stroke="url(#line)" stroke-width="1.5" stroke-opacity="0.24"/>

  <g opacity="0.85" filter="url(#softGlow)">
    <circle cx="207" cy="42" r="3.5" fill="#F5D38A"/>
    <circle cx="486" cy="129" r="3.5" fill="#F6F0DE"/>
    <circle cx="872" cy="184" r="3.5" fill="#68E0C4"/>
    <circle cx="1082" cy="84" r="3.5" fill="#F5D38A"/>
    <circle cx="566" cy="236" r="3" fill="#F6F0DE"/>
    <circle cx="952" cy="237" r="3" fill="#68E0C4"/>
  </g>

  <g transform="translate(96 74)" opacity="0.92">
    <rect x="0" y="0" width="214" height="214" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M58 112L103 67L148 112L103 157L58 112Z" stroke="#F6F0DE" stroke-width="2" stroke-opacity="0.72"/>
    <path d="M103 67V157M58 112H148" stroke="#68E0C4" stroke-width="1.5" stroke-opacity="0.42"/>
    <circle cx="103" cy="112" r="10" fill="#F5D38A" fill-opacity="0.88"/>
  </g>

  <g transform="translate(1006 78)" opacity="0.66">
    <rect x="0" y="0" width="150" height="158" rx="28" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <path d="M36 52H114M36 80H114M36 108H114" stroke="#F6F0DE" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.46"/>
  </g>

  <g transform="translate(350 104)">
    <text x="0" y="53" fill="#F8F5EA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0">Soham Kamat</text>
    <rect x="2" y="84" width="430" height="1.5" fill="url(#line)" opacity="0.86"/>
    <text x="2" y="132" fill="#D8D4C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="500" letter-spacing="0">Building thoughtful software.</text>
  </g>

  <g opacity="0.2">
    <path d="M393 286H887" stroke="#F6F0DE"/>
    <path d="M421 302H859" stroke="#68E0C4"/>
  </g>
</svg>
